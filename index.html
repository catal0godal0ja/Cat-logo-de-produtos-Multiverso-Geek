<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiversoGeek | Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="index.html" class="logo-container">
                <img src="logo.png" alt="Logo" class="main-logo">
            </a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="O que você procura?">
            </div>
            <button id="openAdmin">⚙️</button>
        </div>
    </header>

    <nav class="categories">
        <div class="container nav-scroll" id="categoryList">
            <!-- Categorias via JS -->
        </div>
    </nav>

    <main class="container">
        <div id="productGrid" class="product-grid"></div>
    </main>

    <!-- MODAL ADMIN -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom:20px">Cadastrar Produto</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="pName" required>
                </div>
                <div class="form-group">
                    <label>Preço</label>
                    <input type="number" step="0.01" id="pPrice" required>
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="pCategory"></select>
                </div>
                <div class="form-group">
                    <label>Foto do Produto (Do seu PC)</label>
                    <input type="file" id="pImageFile" accept="image/*">
                    <input type="hidden" id="pImage">
                </div>
                <button type="submit" style="background:var(--primary); color:white; padding:15px; width:100%; border:none; border-radius:8px; cursor:pointer; font-weight:bold">Salvar</button>
                <button type="button" class="close" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer">Fechar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
