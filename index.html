<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiversoGeek | Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo-container">
                <img src="logo.png" alt="Logo" class="main-logo">
            </a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Pesquisar...">
            </div>
            <button id="openAdmin">⚙️</button>
        </div>
    </header>

    <nav class="categories">
        <div class="container nav-scroll" id="categoryList"></div>
    </nav>

    <main class="container">
        <div id="productGrid" class="product-grid"></div>
    </main>

    <!-- MODAL ADMINISTRATIVO COM LISTA DE GERENCIAMENTO -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h2 style="color:white; margin-bottom:15px">Novo Produto</h2>
            
            <!-- Formulário de Cadastro -->
            <form id="productForm">
                <div class="form-group">
                    <input type="text" id="pName" placeholder="Nome do Produto" required>
                </div>
                <div class="form-group">
                    <input type="number" step="0.01" id="pPrice" placeholder="Preço" required>
                </div>
                <div class="form-group">
                    <select id="pCategory"></select>
                </div>
                <div class="form-group">
                    <label style="color:gray; font-size:0.8rem; display:block; margin-bottom:5px">Selecionar Foto da Galeria:</label>
                    <input type="file" id="pImageFile" accept="image/*">
                    <input type="hidden" id="pImage">
                </div>
                <button type="submit" style="background:var(--primary); color:white; width:100%; padding:12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold">Salvar Produto</button>
                <button type="button" class="close-btn" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer">Fechar Janela</button>
            </form>

            <!-- ESPAÇO PARA APAGAR PRODUTOS (NOVO) -->
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #334155;">
            <h3 style="color:white; margin-bottom:10px; font-size: 1rem;">Gerenciar/Apagar Produtos</h3>
            <div id="adminProductList">
                <!-- A lista com botões de APAGAR aparecerá aqui via JavaScript -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
