<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiversoGeek | Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo-container">
                <img src="logo.png" alt="Logo" class="main-logo">
            </a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Pesquisar...">
            </div>
            <button id="openAdmin">⚙️</button>
        </div>
    </header>

    <nav class="categories">
        <div class="container nav-scroll" id="categoryList"></div>
    </nav>

    <main class="container">
        <div id="productGrid" class="product-grid"></div>
    </main>

    <!-- 1. MODAL ADMINISTRATIVO (CADASTRAR E APAGAR) -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h2 style="color:white; margin-bottom:15px">Novo Produto</h2>
            
            <form id="productForm">
                <div class="form-group">
                    <input type="text" id="pName" placeholder="Nome do Produto" required>
                </div>
                <div class="form-group">
                    <input type="number" step="0.01" id="pPrice" placeholder="Preço" required>
                </div>
                <div class="form-group">
                    <select id="pCategory"></select>
                </div>
                <div class="form-group">
                    <label style="color:gray; font-size:0.8rem; display:block; margin-bottom:5px">Selecionar Foto da Galeria:</label>
                    <input type="file" id="pImageFile" accept="image/*">
                    <input type="hidden" id="pImage">
                </div>
                <button type="submit" style="background:var(--primary); color:white; width:100%; padding:12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold">Salvar Produto</button>
                <button type="button" class="close-btn" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer">Fechar Janela</button>
            </form>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #334155;">
            <h3 style="color:white; margin-bottom:10px; font-size: 1rem;">Gerenciar/Apagar Produtos</h3>
            <div id="adminProductList">
                <!-- Lista via JS -->
            </div>
        </div>
    </div>

    <!-- 2. NOVO: MODAL DE VISUALIZAÇÃO (VER DETALHES DO PRODUTO) -->
    <div id="viewModal" class="modal">
        <div class="modal-content" style="max-width: 600px; text-align: center;">
            <span class="close-view" style="float:right; cursor:pointer; color:gray; font-size:25px;">&times;</span>
            <img id="viewImage" style="width:100%; max-height:400px; object-fit:contain; border-radius:10px; margin-bottom:15px; background:white;">
            <h2 id="viewName" style="color:var(--text-main); margin-bottom:10px;"></h2>
            <p id="viewCategory" style="color:var(--primary); font-weight:bold; text-transform:uppercase; font-size:0.8rem; margin-bottom:10px;"></p>
            <div id="viewPrice" style="font-size:1.8rem; font-weight:800; color:var(--text-main); margin-bottom:15px;"></div>
            <p id="viewDesc" style="color:var(--text-muted); margin-bottom:20px; line-height:1.4;"></p>
            
            <a id="viewZap" href="#" target="_blank" class="btn-buy-zap" style="font-size:1.1rem; padding:15px;">
                Confirmar Interesse via WhatsApp
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
